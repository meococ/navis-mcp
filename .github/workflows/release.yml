name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach release assets to (e.g. v0.1.0). Required for manual runs."
        required: true
        type: string
      plugin_artifact_name:
        description: "Optional workflow artifact name containing pre-built plugin DLLs"
        required: false
        default: ""

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download pre-built plugin artifact (optional workflow_dispatch)
        if: ${{ github.event.inputs.plugin_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.plugin_artifact_name }}
          path: .plugin-prebuilt

      - name: Download plugin cache from latest release (public runners)
        if: ${{ github.event.inputs.plugin_artifact_name == '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .plugin-prebuilt | Out-Null
          $api = "C:\Program Files\Autodesk\Navisworks Manage 2026\Autodesk.Navisworks.Api.dll"
          if (Test-Path $api) {
            Write-Host "Navisworks present on runner; plugin will be built from API refs."
            exit 0
          }
          $candidates = @("plugin-cache")
          try {
            $latest = gh release list --limit 20 --json tagName -q ".[].tagName"
            $candidates += ($latest | Where-Object { $_ -and $_ -ne "plugin-cache" })
          } catch { }
          foreach ($tag in $candidates) {
            Write-Host "Trying plugin-navis2026.zip from release $tag ..."
            gh release download $tag -p "plugin-navis2026.zip" -D .plugin-prebuilt --clobber 2>$null
            if (Test-Path ".plugin-prebuilt/plugin-navis2026.zip") {
              Expand-Archive -LiteralPath ".plugin-prebuilt/plugin-navis2026.zip" -DestinationPath ".plugin-prebuilt/unpacked" -Force
              $dll = Get-ChildItem .plugin-prebuilt/unpacked -Recurse -Filter "NavisMcp.Plugin.Navis2026.dll" | Select-Object -First 1
              if ($dll) {
                Write-Host "Using cached plugin from $tag : $($dll.FullName)"
                exit 0
              }
            }
          }
          Write-Host "::warning::No Navisworks on runner and no plugin-navis2026.zip in releases yet."
          exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack release zip
        shell: pwsh
        run: |
          $prebuilt = Get-ChildItem -Path .plugin-prebuilt -Recurse -Filter "NavisMcp.Plugin.Navis2026.dll" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($prebuilt) {
            ./packaging/build-release.ps1 -PluginDllPath $prebuilt.FullName
          }
          else {
            ./packaging/build-release.ps1
          }

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag.StartsWith("v")) {
            throw "Release tag must look like v0.1.0 (got '$tag')."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            dist/NavisMcp-*-win-x64.zip
            dist/plugin-navis2026.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure plugin cache zip is attached
        shell: pwsh
        run: |
          if (-not (Test-Path dist/plugin-navis2026.zip)) {
            $dll = Get-ChildItem dist/stage/bundle -Recurse -Filter "NavisMcp.Plugin.Navis2026.dll" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($dll) {
              Compress-Archive -Path (Join-Path $dll.Directory.FullName "*") -DestinationPath dist/plugin-navis2026.zip -Force
            }
          }
          if (Test-Path dist/plugin-navis2026.zip) {
            gh release upload "${{ steps.meta.outputs.tag }}" dist/plugin-navis2026.zip --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
